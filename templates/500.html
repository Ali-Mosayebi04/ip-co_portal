<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطای سرور | پورتال داخلی ایپکو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            font-family: "IBM Plex Sans Arabic", "Vazirmatn", Tahoma, sans-serif;
            background: #f3f5f9;
            color: #101a2c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            max-width: 440px;
            padding: 48px 32px;
        }
        .code { font-size: 4rem; font-weight: 800; color: #1b4d8c; margin: 0 0 16px; line-height: 1; }
        h1 { font-size: 1.375rem; margin: 0 0 12px; }
        p { color: #4b5768; margin: 0 0 28px; line-height: 1.75; }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: #1b4d8c;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="code" aria-hidden="true">۵۰۰</p>
        <h1>خطایی در سرور رخ داد</h1>
        <p>در حال حاضر مشکلی در پردازش درخواست شما پیش آمده است. تیم فنی از این موضوع مطلع شده و در حال بررسی است. لطفاً کمی بعد دوباره تلاش کنید.</p>
        <a href="/static">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
