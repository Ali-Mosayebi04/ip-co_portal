<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطای سرور | پورتال خبری ایران‌خودرو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Vazirmatn:wght@400;600;700;800&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --color-bg-primary: #f4f7fb;
            --color-bg-secondary: #edf3fa;
            --color-surface: #ffffff;
            --color-text-primary: #101b2a;
            --color-text-secondary: #38485e;
            --color-primary: #0e4e8a;
            --color-primary-hover: #0d426f;
            --color-warning: #9a6b1d;
            --color-warning-soft: #fff5e2;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Vazirmatn", "IBM Plex Sans Arabic", Tahoma, sans-serif;
            background: radial-gradient(720px 380px at 85% 0%, rgba(14, 78, 138, 0.12), transparent 65%),
            linear-gradient(180deg, var(--color-bg-secondary) 0%, var(--color-bg-primary) 100%);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.9;
        }

        .card {
            text-align: center;
            max-width: 520px;
            padding: 48px 32px;
        }

        .code {
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            line-height: 1;
            margin: 0 0 20px;
            background: linear-gradient(140deg, var(--color-primary), #0a3558);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .rule {
            width: 42px;
            height: 2px;
            margin: 0 auto 20px;
            background: var(--color-warning);
            border-radius: 2px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 12px;
        }

        p {
            color: var(--color-text-secondary);
            margin: 0 0 32px;
        }

        a {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding: 0 24px;
            background: var(--color-primary);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 6px 18px -6px rgba(10, 28, 48, 0.35);
            transition: transform 160ms ease, background 160ms ease;
        }

        a:hover {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="card">
    <p class="code" aria-hidden="true">۵۰۰</p>
    <div class="rule" aria-hidden="true"></div>
    <h1>خطایی در سرور رخ داد</h1>
    <p>در حال حاضر مشکلی در پردازش درخواست شما پیش آمده است. تیم فنی از این موضوع مطلع شده و در حال بررسی است. لطفاً کمی
        بعد دوباره تلاش کنید.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
</div>
</body>
</html>
