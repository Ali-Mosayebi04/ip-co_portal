{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="theme-init">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پورتال داخلی ایپکو{% endblock %}</title>
    <meta name="description" content="پورتال داخلی اطلاع‌رسانی، اخبار و خدمات سازمانی شرکت ایپکو">
    <meta name="theme-color" content="#0a2c5c">

    <script>
        (function () {
            try {
                var stored = localStorage.getItem("ikco-theme") || "system";
                var resolved = stored === "system"
                    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : stored;
                document.documentElement.setAttribute("data-theme", resolved);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>

    {% include "partials/header.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{% static 'home/js/main.js' %}" defer></script>
</body>
</html>
