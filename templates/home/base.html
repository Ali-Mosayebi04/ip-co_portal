{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="theme-init">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پورتال خبری ایران‌خودرو | ایپکو{% endblock %}</title>
    <meta name="description" content="پورتال رسمی اطلاع‌رسانی، اخبار و خدمات سازمانی شرکت تحقیق، طراحی و تولید موتور ایران‌خودرو (ایپکو)">
    <meta name="theme-color" content="#0a1c30">

    <script>
        (function () {
            try {
                var stored = localStorage.getItem("ikco-theme") || "system";
                var resolved = stored === "system"
                    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : stored;
                document.documentElement.setAttribute("data-theme", resolved);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/card-system.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/ui-enhancements.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/pagination.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/archive-pages.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>

    {% include "partials/header.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{% static 'home/js/main.js' %}" defer></script>
</body>
</html>
